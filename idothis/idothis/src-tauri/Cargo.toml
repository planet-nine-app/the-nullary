[package]
name = "idothis"
version = "0.1.0"
description = "IDothis - Professional discovery platform for Planet Nine ecosystem"
authors = ["Planet Nine"]
license = "MIT"
repository = "https://github.com/planet-nine-app/planet-nine"
edition = "2021"

[lib]
name = "idothis"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-app-group = { path = "tauri-plugin-app-group" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sessionless = "0.1.1"
hex = "0.4"

[dependencies.bdo-rs]
path = "../../../../bdo/src/client/rust/bdo-rs"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
